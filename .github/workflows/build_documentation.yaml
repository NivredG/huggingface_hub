name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@6f0962e04218e46b8117ac5990789cccebb647d8  # main
    with:
      commit_sha: ${{ github.sha }}
      package: huggingface_hub
      languages: cn de fr en hi ko or ta
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
